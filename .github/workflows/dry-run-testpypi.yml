name: Dry run publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from (branch, tag, or SHA)"
        required: false
        default: main
        type: string
      python-version:
        description: "CPython version to build"
        required: true
        default: "3.12"
        type: choice
        options:
          - "3.11"
          - "3.12"

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CMAKE_INSTALL_PARALLEL_LEVEL: "2"
      MAKEFLAGS: "-j2"
      NINJAFLAGS: "-j2"
      MAX_JOBS: "2"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Add swap for native build
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel auditwheel patchelf

      - name: Build wheel
        run: python -m build --wheel --outdir ../dist
        working-directory: senpy

      - name: Repair wheel for manylinux
        run: |
          cd dist
          for whl in *.whl; do
            auditwheel repair "$whl" -w repaired
            rm "$whl"
          done
          mv repaired/*.whl .
          rmdir repaired
          cd ..

      - name: List wheel
        run: ls -lh dist

      - name: Smoke test wheel
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "import pathlib, senpy; assert pathlib.Path(senpy.__file__).resolve().is_relative_to(pathlib.Path('${{ github.workspace }}').resolve()) is False; print('senpy imported successfully')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/arcascope-senpy
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -lh dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
